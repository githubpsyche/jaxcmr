name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  scientific:
    name: Scientific checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      MPLBACKEND: Agg
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv sync --locked --no-dev --extra test
      - run: uv run --no-sync python -m pytest tests --ignore=tests/test_distribution.py --junitxml=scientific.xml
  distribution:
    name: Installation and documentation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      MPLBACKEND: Agg
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv sync --locked --no-dev --extra test
      - run: uv run --no-sync python -m pytest tests/test_distribution.py --junitxml=distribution.xml
