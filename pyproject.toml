[project]
name = "jaxcmr"
version = "0.2.0rc1"
description = "modeling memory search with jax"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Jordan Gunn", email = "gunnjordanb@gmail.com" }]
urls = { "Homepage" = "https://githubpsyche.github.io/jaxcmr/", "Source" = "https://github.com/githubpsyche/jaxcmr" }
keywords = ["memory", "free recall", "serial recall", "jax"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "evosax>=0.3.1,<0.4",
    "flax>=0.10,<0.11",
    "h5py>=3.12.1",
    "jax>=0.8,<0.9",
    "jaxtyping>=0.2.36",
    "matplotlib>=3.5",
    "numpy>=1.0",
    "pandas",
    "scipy>=1.15.0",
    "tabulate>=0.9.0",
    "tqdm>=4.67.1",
    "typing-extensions>=4.13",
]

[project.optional-dependencies]
colab = []
experimental = ["numba>=0.61.0"]
test = ["pytest>=8.3.5"]

[dependency-groups]
reader = ["nbmake==1.5.5", "pytest-xdist==3.8.0", "pytest>=8.3.5,<10", "openpyxl", "pillow"]
dev = [
    "build>=1.2",
    "ipykernel>=6.29.5",
    "ipython>=8.31.0",
    "jupytext>=1.16.7",
    "nbclient>=0.10",
    "nbdev>=2.3.37",
    "papermill>=2.6.0",
    "pytest>=8.3.5",
]
embeddings = ["sentence-transformers>=5.1.0"]
profiling = ["line-profiler>=4.2.0"]

[tool.hatch.build.targets.wheel]
    packages = ["jaxcmr"]

[tool.hatch.build.targets.wheel.force-include]
"data/Dupertuys2026.h5" = "jaxcmr/_example_inputs/data/Dupertuys2026.h5"
"data/Dupertuys2026_semantic_distances.npy" = "jaxcmr/_example_inputs/data/Dupertuys2026_semantic_distances.npy"
"data/fits/Dupertuys2026_CMR_demo.json" = "jaxcmr/_example_inputs/data/fits/Dupertuys2026_CMR_demo.json"
"data/fits/Dupertuys2026_eCMR_source_only.json" = "jaxcmr/_example_inputs/data/fits/Dupertuys2026_eCMR_source_only.json"
"data/fits/Dupertuys2026_eCMR_broad.json" = "jaxcmr/_example_inputs/data/fits/Dupertuys2026_eCMR_broad.json"
"data/simulations/Dupertuys2026_CMR_demo_best_of_3.h5" = "jaxcmr/_example_inputs/data/simulations/Dupertuys2026_CMR_demo_best_of_3.h5"
"data/simulations/Dupertuys2026_CMR_demo_best_of_3.json" = "jaxcmr/_example_inputs/data/simulations/Dupertuys2026_CMR_demo_best_of_3.json"
"data/simulations/Dupertuys2026_eCMR_broad_demo_best_of_3.h5" = "jaxcmr/_example_inputs/data/simulations/Dupertuys2026_eCMR_broad_demo_best_of_3.h5"
"data/simulations/Dupertuys2026_eCMR_broad_demo_best_of_3.json" = "jaxcmr/_example_inputs/data/simulations/Dupertuys2026_eCMR_broad_demo_best_of_3.json"
"data/simulations/Dupertuys2026_eCMR_source_only_demo_best_of_3.h5" = "jaxcmr/_example_inputs/data/simulations/Dupertuys2026_eCMR_source_only_demo_best_of_3.h5"
"data/simulations/Dupertuys2026_eCMR_source_only_demo_best_of_3.json" = "jaxcmr/_example_inputs/data/simulations/Dupertuys2026_eCMR_source_only_demo_best_of_3.json"
"data/fits/README.md" = "jaxcmr/_example_inputs/data/fits/README.md"

[tool.hatch.build.targets.sdist]
exclude = ["/guide/templates/**", "/guide/downloads/**", "/guide/.quarto/**"]
include = ["/jaxcmr", "/tests", "/templates/models/cmr.ipynb", "/templates/parameter_shifting.ipynb", "/templates/guide/getting-started.qmd", "/guide", "/README.md", "/LICENSE", "/pyproject.toml", "/uv.lock", "/.python-version", "/build-docs.sh", "/data/Dupertuys2026.h5", "/data/Dupertuys2026_semantic_distances.npy", "/data/fits/Dupertuys2026_CMR_demo.json", "/data/fits/Dupertuys2026_eCMR_source_only.json", "/data/fits/Dupertuys2026_eCMR_broad.json", "/data/simulations/Dupertuys2026_CMR_demo_best_of_3.h5", "/data/simulations/Dupertuys2026_CMR_demo_best_of_3.json", "/data/simulations/Dupertuys2026_eCMR_broad_demo_best_of_3.h5", "/data/simulations/Dupertuys2026_eCMR_broad_demo_best_of_3.json", "/data/simulations/Dupertuys2026_eCMR_source_only_demo_best_of_3.h5", "/data/simulations/Dupertuys2026_eCMR_source_only_demo_best_of_3.json", "/data/fits/README.md"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["audit: compilation reuse checks for prepared losses and fitters"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
