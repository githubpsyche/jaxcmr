[project]
name = "jaxcmr"
version = "0.2.0rc1"
description = "modeling memory search with jax"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Jordan Gunn", email = "gunnjordanb@gmail.com" }]
urls = { "Homepage" = "https://githubpsyche.github.io/jaxcmr/", "Source" = "https://github.com/githubpsyche/jaxcmr" }
keywords = ["memory", "free recall", "serial recall", "jax"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "evosax>=0.3.1,<0.4",
    "flax>=0.10,<0.11",
    "h5py>=3.12.1",
    "jax>=0.8,<0.9",
    "jaxtyping>=0.2.36",
    "matplotlib>=3.5",
    "numpy>=1.0",
    "scipy>=1.15.0",
    "seaborn>=0.13.2",
    "tabulate>=0.9.0",
    "tqdm>=4.67.1",
    "typing-extensions>=4.13",
]

[project.optional-dependencies]
colab = ["pooch>=1.8,<2"]
experimental = ["numba>=0.61.0"]
test = ["pytest>=8.3.5", "build>=1.2", "nbclient>=0.10", "ipykernel>=6.29.5"]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "ipython>=8.31.0",
    "jupytext>=1.16.7",
    "nbdev>=2.3.37",
    "papermill>=2.6.0",
    "pytest>=8.3.5",
]
embeddings = ["sentence-transformers>=5.1.0"]
profiling = ["line-profiler>=4.2.0"]

[tool.hatch.build.targets.wheel]
    packages = ["jaxcmr"]

[tool.hatch.build.targets.sdist]
exclude = ["/guide/templates/**", "/guide/downloads/**", "/guide/.quarto/**"]
include = ["/jaxcmr", "/tests", "/templates/models/cmr.ipynb", "/templates/parameter_shifting.ipynb", "/templates/guide/getting-started.qmd", "/guide", "/README.md", "/LICENSE", "/pyproject.toml", "/uv.lock", "/.python-version", "/build-docs.sh"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
