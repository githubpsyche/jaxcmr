# Earlier Quarto releases break code-tools when code-copy is enabled.
quarto-required: ">=1.10.20"

project:
  type: website
  output-dir: ../docs
  render:
    - index.ipynb
    - installation.qmd
    - developer-setup.ipynb
    - colab-setup.qmd
    - slurm-setup.qmd
    - tutorials/*.ipynb
    - overview/*.qmd
    - overview/*.ipynb
    - templates.qmd
    - templates/*.ipynb
    - development.qmd
    - "!downloads/**"
    - "!examples/**"
  pre-render: uv run --no-sync python prepare.py
  resources:
    - .nojekyll
    - templates/data/**
    - downloads/**

website:
  title: "JAXCMR"
  description: "Computational models of memory search"
  site-url: https://githubpsyche.github.io/jaxcmr/
  repo-url: https://github.com/githubpsyche/jaxcmr
  page-navigation: true
  search:
    location: navbar
    type: overlay
  navbar:
    background: white
    pinned: true
    left:
      - href: installation.qmd
        text: Installation
      - href: tutorials/data-preparation.ipynb
        text: Tutorials
      - href: overview/index.qmd
        text: Library Guide
      - href: templates.qmd
        text: Templates
      - href: development.qmd
        text: Development
    right:
      - icon: github
        href: https://github.com/githubpsyche/jaxcmr
        aria-label: Source Code
  sidebar:
    - title: Installation
      style: floating
      contents:
        - installation.qmd
        - developer-setup.ipynb
        - colab-setup.qmd
        - slurm-setup.qmd
    - title: Tutorials
      style: floating
      collapse-level: 1
      contents:
        - tutorials/data-preparation.ipynb
        - tutorials/template-tour.ipynb
    - title: Library Guide
      contents:
        - overview/index.qmd
        - overview/data.ipynb
        - overview/analyses.ipynb
        - overview/models.ipynb
        - overview/components.ipynb
        - overview/losses.ipynb
        - overview/fitting.ipynb
        - overview/simulation.ipynb
        - overview/evaluation.ipynb
    - title: Templates
      contents:
        - templates.qmd
        - templates/fitting.ipynb
        - templates/simulation.ipynb
        - templates/parameter_shifting.ipynb
        - templates/model_comparison.ipynb
        - templates/spc.ipynb
        - templates/pnr.ipynb
        - templates/termination_probability.ipynb
        - templates/crp.ipynb
        - templates/lagrank.ipynb
        - templates/distcrp.ipynb
        - templates/distrank.ipynb
        - templates/cat_recall_rate.ipynb
        - templates/cat_spc.ipynb
        - templates/catcrp.ipynb

format:
  html:
    theme:
      - default
      - styles.scss
    number-sections: false
    lightbox: true
    toc: true
    toc-location: right
    grid:
      sidebar-width: 230px
      body-width: 900px
      margin-width: 220px
      gutter-width: 1.5rem
    code-copy: true
    code-line-numbers: true
    code-fold: true
    code-summary: "Show code"
    code-overflow: scroll

execute:
  enabled: false
  warning: false
