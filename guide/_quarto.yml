# Earlier Quarto releases break code-tools when code-copy is enabled.
quarto-required: "=1.11.9"

project:
  type: website
  output-dir: ../docs
  render:
    - index.ipynb
    - installation.qmd
    - developer-setup.ipynb
    - colab-setup.qmd
    - slurm-setup.qmd
    - tutorials/*.ipynb
    - tutorials/*.qmd
    - overview/*.qmd
    - overview/*.ipynb
    - templates.qmd
    - templates/*.ipynb
    - development.qmd
    - reference/index.qmd
    - reference/plotting.qmd
    - reference/simulation.qmd
    - reference/summarize.qmd
    - reference/repetition.qmd
    - reference/math.qmd
    - reference/typing.qmd
    - reference/dataset.qmd
    - reference/helpers.qmd
    - reference/examples.qmd
    - reference/loss-*.qmd
    - reference/fitting.qmd
    - reference/analyses*.qmd
    - reference/experimental*.qmd
    - "!reference/_generated/**"
    - "!downloads/**"
    - "!examples/**"
  pre-render: uv run --no-sync python prepare.py
  resources:
    - .nojekyll
    - templates/data/**
    - downloads/**

website:
  title: "JAXCMR"
  description: "Computational models of memory search"
  site-url: https://githubpsyche.github.io/jaxcmr/
  repo-url: https://github.com/githubpsyche/jaxcmr
  page-navigation: true
  search:
    location: navbar
    type: overlay
  navbar:
    background: white
    pinned: true
    left:
      - href: installation.qmd
        text: Setup
      - href: tutorials/data-preparation.ipynb
        text: Tutorials
      - href: overview/index.qmd
        text: Library Guide
      - href: reference/index.qmd
        text: API Reference
      - href: templates.qmd
        text: Templates
      - href: development.qmd
        text: Development
    right:
      - icon: github
        href: https://github.com/githubpsyche/jaxcmr
        aria-label: Source Code
  sidebar:
    - title: Setup
      style: floating
      contents:
        - installation.qmd
        - developer-setup.ipynb
        - colab-setup.qmd
        - slurm-setup.qmd
        - href: tutorials/slurm-batch-jobs.qmd
          text: Run batches of notebooks unattended on Slurm
    - title: Tutorials
      style: floating
      collapse-level: 1
      contents:
        - tutorials/data-preparation.ipynb
        - tutorials/template-tour.ipynb
    - title: Library Guide
      contents:
        - overview/index.qmd
        - overview/data.ipynb
        - overview/analyses.ipynb
        - overview/models.ipynb
        - overview/components.ipynb
        - overview/losses.ipynb
        - overview/fitting.ipynb
        - overview/simulation.ipynb
        - overview/evaluation.ipynb
    - title: API Reference
      id: api-reference
      collapse-level: 1
      contents:
        - href: reference/index.qmd
          text: Overview
        - href: reference/dataset.qmd
          text: Datasets
        - href: reference/loss-sequence.qmd
          text: Sequential likelihood
        - href: reference/loss-mse.qmd
          text: Behavioral MSE
        - href: reference/fitting.qmd
