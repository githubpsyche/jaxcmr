format:
  html:
    theme:
      light: [default, styles.scss]
    number-sections: false
    lightbox: true
    toc: true
    toc-location: right
    grid:
      sidebar-width: 230px
      body-width: 900px
      margin-width: 220px
      gutter-width: 1.5rem
    code-copy: true
    code-line-numbers: true
    code-fold: show
    code-summary: "Code"
    code-overflow: scroll

execute:
  enabled: false
  warning: false
